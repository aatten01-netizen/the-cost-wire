# Downloads the current USDA AMS Iowa (and Illinois) Production Cost Report PDFs into
# tests/samples/ so the PDF parser (PLAN step 2b) can be tested against the
# real file. Free: uses GitHub's built-in token, no keys.
# Runs by hand only (Actions tab > Fetch sample reports > Run workflow).
# The push trigger was removed on 2026-10-30: GitHub refused to start the job
# because the account's Actions minutes / spending limit ran out, so it only
# made red X's. Run it by hand once GitHub billing is sorted.
name: Fetch sample reports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Iowa Production Cost Report PDF
        run: |
          curl -fsSL -A "TheCostWire/0.1" -o tests/samples/ams_2863.pdf \
            https://www.ams.usda.gov/mnreports/ams_2863.pdf
          file tests/samples/ams_2863.pdf
      - name: Download Illinois Production Cost Report PDF
        run: |
          curl -fsSL -A "TheCostWire/0.1" -o tests/samples/ams_3195.pdf \
            https://www.ams.usda.gov/mnreports/ams_3195.pdf
          file tests/samples/ams_3195.pdf
      - name: Commit sample if new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tests/samples/ams_2863.pdf tests/samples/ams_3195.pdf
          git diff --cached --quiet || git commit -m "Add samples: current Iowa + Illinois Production Cost Report PDFs"
          git push
