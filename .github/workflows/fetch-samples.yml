# Downloads the current USDA AMS Iowa Production Cost Report PDF into
# tests/samples/ so the PDF parser (PLAN step 2b) can be tested against the
# real file. Free: uses GitHub's built-in token, no keys.
# Runs when this file changes, or by hand from the Actions tab.
name: Fetch sample reports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-samples.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Iowa Production Cost Report PDF
        run: |
          curl -fsSL -A "TheCostWire/0.1" -o tests/samples/ams_2863.pdf \
            https://www.ams.usda.gov/mnreports/ams_2863.pdf
          file tests/samples/ams_2863.pdf
      - name: Commit sample if new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tests/samples/ams_2863.pdf
          git diff --cached --quiet || git commit -m "Add sample: current Iowa Production Cost Report PDF"
          git push
